name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de régression
        run: node --test tests/*.test.js

  lint:
    name: Lint extension (web-ext)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Tout avertissement web-ext fait échouer le job (le lint est à 0 depuis
      # la correction des innerHTML).
      - name: web-ext lint
        run: >
          npx --yes web-ext lint
          --source-dir .
          --warnings-as-errors
          --ignore-files "tests/**" "README.md" "PRIVACY.md" ".github/**"
