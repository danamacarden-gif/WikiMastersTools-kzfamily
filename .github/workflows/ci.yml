name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de régression
        run: node --test tests/*.test.js

  lint:
    name: Lint extension (web-ext)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Les avertissements ne font pas échouer le job pour l'instant
      # (4 avertissements innerHTML connus). Ajouter --warnings-as-errors
      # une fois corrigés.
      - name: web-ext lint
        run: >
          npx --yes web-ext lint
          --source-dir .
          --ignore-files "tests/**" "README.md" "PRIVACY.md" ".github/**"
